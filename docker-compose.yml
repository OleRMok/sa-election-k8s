services:
  backend:
    build:
      context: ./apps/backend
    container_name: sa-voting-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - election-net

  frontend:
    build:
      context: ./apps/frontend
      # Explicitly pointing to the file fixes the "no such file" error
      dockerfile: Dockerfile 
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: sa-voting-frontend
    ports:
      - "8080:80"
    networks:
      - election-net

  redis:
    image: "redis:alpine"
    container_name: sa-voting-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - election-net

networks:
  election-net:
    driver: bridge