apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: election
  labels:
    app: backend
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
      - name: backend
        image: sa-election-backend:v2
        imagePullPolicy: Never #for local testing, change to IfNotPresent or Always for production
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: election-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: election-config
              key: REDIS_PORT
        - name: SECRET_SALT
          valueFrom:
            secretKeyRef:
              name: election-secrets
              key: SECRET_SALT
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: election-config
              key: ALLOWED_ORIGINS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # FIXED: Liveness probe now hits the valid /health endpoint
        livenessProbe:
          httpGet:
            path: /health  
            port: 8000
          initialDelaySeconds: 15 # Reduced slightly to catch issues faster
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
