apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: election
  labels:
    app: redis
    tier: database 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: database
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
          name: redis
        # UPDATED: Added save intervals and better AOF behavior
        command: ["redis-server"]
        args: [
          "--appendonly", "yes", 
          "--appendfsync", "everysec",
          "--save", "60", "1",
          "--dir", "/data"
        ]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15 # Lowered to recover faster
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
